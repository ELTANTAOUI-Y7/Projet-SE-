version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: phone-shop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: phone_shoop
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - phone-shop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Phone Shop Application
  phone-shop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phone-shop-app
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=phone_shoop
      - DB_USER=root
      - DB_PASSWORD=root
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - phone-shop-network
    restart: unless-stopped
    labels:
      - "prometheus.io/scrape=true"
      - "prometheus.io/port=8080"
      - "prometheus.io/path=/metrics"

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: phone-shop-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9091:9090"  # Using 9091 to avoid conflict with Sonar (9000)
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - phone-shop-network
    restart: unless-stopped
    depends_on:
      - phone-shop

  # Grafana
  grafana:
    image: grafana/grafana:10.4.0
    container_name: phone-shop-grafana
    ports:
      - "3001:3000"  # Using 3001 to avoid conflicts
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - phone-shop-network
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  phone-shop-network:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data: